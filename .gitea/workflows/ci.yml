name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy action
        uses: clechasseur/rs-clippy-check@v4
        with:
          args: --all-features -- -D warnings
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Run cargo doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs

  test:
    runs-on: ubuntu-latest
    name: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: cargo test --locked (default features)
        run: cargo test --locked
      - name: cargo test --locked (all features)
        run: cargo test --locked --all-features --all-targets
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

  library-features:
    runs-on: ubuntu-latest
    name: library feature matrix
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Check default features
        run: cargo check --locked --all-targets
      - name: Check theme feature
        run: cargo check --locked --no-default-features --features theme --all-targets
      - name: Check lightweight widgets
        run: cargo check --locked --no-default-features --all-targets
      - name: Check preview API
        run: cargo check --locked --no-default-features --features preview --lib
      - name: Check full embeddable app
        run: cargo check --locked --no-default-features --features full-app --all-targets
      - name: Check trash support
        run: cargo check --locked --no-default-features --features trash --all-targets
      - name: Check archive support
        run: cargo check --locked --no-default-features --features archive --all-targets
      - name: Check persistence (settings + keymap parsing)
        run: cargo check --locked --no-default-features --features persistence --all-targets
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

  test-nu:
    runs-on: ubuntu-latest
    name: test-nu
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install Nushell
        if: runner.os == 'Linux'
        run: |
          V=0.116.1
          curl -fsSL https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /tmp
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || install -D -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu $HOME/.cargo/bin/nu
          nu --version
      - name: Run Nu script tests
        run: nu scripts/tests/run_all.nu

  # Declared `rust-version` must keep compiling — a dependency bump that
  # needs a newer compiler should fail here, not at a user's machine.
  msrv:
    runs-on: ubuntu-latest
    name: msrv
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: cargo check (MSRV)
        run: cargo check --locked --all-features --all-targets

  # Known-vulnerability scan of Cargo.lock. Advisory-only so a fresh advisory
  # on an unrelated crate cannot block unrelated work.
  audit:
    runs-on: ubuntu-latest
    name: audit
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
