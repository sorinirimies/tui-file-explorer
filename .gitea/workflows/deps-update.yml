name: Nightly Dependency Update

# Nightly: run `cargo update` against the CURRENT tip of main. Only when
# Cargo.lock really changes AND tests + clippy pass do we:
#   1. commit + push to main (and mirror to GitHub if GITHUB_REMOTE_URL is set),
#   2. ONLY if a Cargo.toml dependency requirement changed (`cargo upgrade`): also
#      bump the patch version and tag vX.Y.Z (tag push triggers release.yml).
# A lockfile-only change is merged WITHOUT a version bump, tag or release.

on:
  schedule:
    - cron: "30 0 * * *" # Every night at 00:30 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Never cancel mid-run: a half-finished push/tag would leave main inconsistent.
concurrency:
  group: deps-update
  cancel-in-progress: false

jobs:
  update-deps:
    name: Update Cargo dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITEA_TOKEN || github.token }}
          fetch-depth: 0

      # Scheduled runs can start from a stale commit. Always rebase the working
      # tree onto the real tip of main, otherwise `cargo update` is diffed
      # against an old Cargo.lock (false "changes", unmergeable branches).
      - name: Sync to latest main
        run: |
          git fetch --tags --force origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          git log -1 --oneline

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # A patch release is cut ONLY when `cargo upgrade` really changed a dependency
      # requirement in a Cargo.toml (compared as data: cargo-edit also reformats
      # manifests, which must not count). A lockfile-only change is still merged,
      # but without a version bump, tag or release.
      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Snapshot dependency requirements (before)
        run: cargo metadata --no-deps --format-version 1 | jq -S -c '[.packages[].dependencies[] | {name,req,kind,features,optional,target,uses_default_features}] | sort_by(.name,.kind,.target)' > "${{ runner.temp }}/reqs-before.json"

      - name: Run cargo upgrade + cargo update
        run: |
          cargo upgrade
          cargo update

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependency changes detected:"
            git diff -U0 -- Cargo.lock | grep -E '^[-+](name|version) ' || true
          fi

      - name: Check for dependency requirement changes
        id: reqs
        run: |
          cargo metadata --no-deps --format-version 1 | jq -S -c '[.packages[].dependencies[] | {name,req,kind,features,optional,target,uses_default_features}] | sort_by(.name,.kind,.target)' > "${{ runner.temp }}/reqs-after.json"
          if cmp -s "${{ runner.temp }}/reqs-before.json" "${{ runner.temp }}/reqs-after.json"; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml dependency requirements changed -> patch release."
          fi

      - name: Run tests
        if: steps.check.outputs.changed == 'true'
        run: cargo test --locked --all-features --all-targets

      - name: Run clippy
        if: steps.check.outputs.changed == 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings -A deprecated

      # A dependency bump that needs a newer compiler than our declared
      # `rust-version` must not be released.
      - name: Check MSRV still builds
        if: steps.check.outputs.changed == 'true'
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --locked --all-features --all-targets

      - name: Install release tooling (nushell, git-cliff)
        if: steps.check.outputs.changed == 'true' && steps.reqs.outputs.release == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: nushell,git-cliff

      # Fallback when prebuilt binaries are unavailable.
      - name: Ensure nu + git-cliff are installed
        if: steps.check.outputs.changed == 'true' && steps.reqs.outputs.release == 'true'
        run: |
          command -v nu       >/dev/null || cargo install nu --locked
          command -v git-cliff >/dev/null || cargo install git-cliff --locked
          nu --version
          git-cliff --version

      - name: Commit dependency update
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.gitea"
          if [ "${{ steps.reqs.outputs.release }}" = "true" ]; then
            git add Cargo.lock $(git ls-files -m -- '*Cargo.toml')
          else
            git ls-files -m -- '*Cargo.toml' | xargs -r git checkout --
            git add Cargo.lock
          fi
          git commit -m "chore(deps): nightly cargo update $(date -u '+%Y-%m-%d')"

      - name: Compute next patch version
        if: steps.check.outputs.changed == 'true' && steps.reqs.outputs.release == 'true'
        id: version
        run: |
          current=$(grep -m1 '^version' Cargo.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"(.*)"/\1/')
          IFS='.' read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          # Never collide with an existing tag.
          while git rev-parse -q --verify "refs/tags/v$next" >/dev/null; do
            patch=$((patch + 1))
            next="$major.$minor.$((patch + 1))"
          done
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $current -> $next"

      - name: Bump version, changelog, commit and tag
        if: steps.check.outputs.changed == 'true' && steps.reqs.outputs.release == 'true'
        run: nu scripts/bump_version.nu --yes ${{ steps.version.outputs.next }}

      # Fail loudly (no `|| true`): a failed push must show as a failed run.
      - name: Push to Gitea
        if: steps.check.outputs.changed == 'true'
        run: |
          git push origin HEAD:main
          if [ "${{ steps.reqs.outputs.release }}" = "true" ]; then
            git push origin "v${{ steps.version.outputs.next }}"
          fi

      - name: Push to GitHub mirror
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_REMOTE_URL: ${{ secrets.GITHUB_REMOTE_URL }}
        run: |
          if [ -z "$GITHUB_REMOTE_URL" ]; then
            echo "GITHUB_REMOTE_URL not set — skipping GitHub mirror."
            exit 0
          fi
          git remote add github-ci "$GITHUB_REMOTE_URL"
          git push github-ci HEAD:main
          if [ "${{ steps.reqs.outputs.release }}" = "true" ]; then
            git push github-ci "v${{ steps.version.outputs.next }}"
          fi

      - name: Nothing to update
        if: steps.check.outputs.changed == 'false'
        run: echo "✅ All dependencies already up to date — no commit, no release."
