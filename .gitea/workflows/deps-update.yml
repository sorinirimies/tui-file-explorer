name: Nightly Dependency Update

on:
  schedule:
    - cron: "30 0 * * *" # Every night at 00:30 UTC — offset from GitHub
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: deps-update
  cancel-in-progress: true

jobs:
  update-deps:
    name: Update Cargo dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITEA_TOKEN || github.token }}
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo update
        run: cargo update

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependency changes detected."
          fi

      - name: Run tests
        if: steps.check.outputs.changed == 'true'
        run: cargo test --locked --all-features --all-targets

      - name: Run clippy
        if: steps.check.outputs.changed == 'true'
        run: cargo clippy -- -D warnings -A deprecated

      # ── Push upgrade branch + create PR + auto-merge ─────────────────────────
      - name: Create and auto-merge Pull Request
        if: steps.check.outputs.changed == 'true'
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN || github.token }}
        run: |
          BRANCH="deps/nightly-cargo-update"
          DATE=$(date -u '+%Y-%m-%d')
          API="${GITHUB_SERVER_URL}/api/v1"
          REPO="${GITHUB_REPOSITORY}"

          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.gitea"

          # Force-create or update the branch
          git checkout -B "$BRANCH"
          git add Cargo.lock
          git commit -m "chore(deps): nightly cargo update $DATE"
          git push --force origin "$BRANCH"

          echo "✅ Branch '$BRANCH' pushed."

          # ── Create the PR ────────────────────────────────────────────────────
          echo "Creating PR on ${REPO}..."
          PR_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API}/repos/${REPO}/pulls" \
            -d "{
              \"title\": \"chore(deps): nightly cargo update ${DATE}\",
              \"head\": \"${BRANCH}\",
              \"base\": \"main\",
              \"body\": \"## Automated Nightly Dependency Update\n\nAll quality checks passed: **tests**, **clippy**.\n\nCreated by the Nightly Dependency Update workflow.\"
            }")

          PR_NUMBER=$(echo "$PR_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('number',''))" 2>/dev/null || true)

          if [ -z "$PR_NUMBER" ]; then
            echo "⚠️  Could not create PR (branch may already have an open PR)."
            # Try to find the existing open PR for this branch
            PR_NUMBER=$(curl -s \
              -H "Authorization: token ${GITEA_TOKEN}" \
              "${API}/repos/${REPO}/pulls?state=open&head=${BRANCH}" \
              | python3 -c "import sys,json; prs=json.load(sys.stdin); print(prs[0]['number'] if prs else '')" 2>/dev/null || true)
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "❌ Could not create or find PR. Skipping auto-merge."
            exit 0
          fi

          echo "✅ PR #${PR_NUMBER} ready."

          # ── Merge the PR ─────────────────────────────────────────────────────
          echo "Merging PR #${PR_NUMBER}..."
          curl -s -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API}/repos/${REPO}/pulls/${PR_NUMBER}/merge" \
            -d "{
              \"Do\": \"merge\",
              \"delete_branch_after_merge\": true
            }"

          echo "✅ PR #${PR_NUMBER} merged and branch deleted."

      # ── Bump patch version, tag, and push to Gitea + GitHub ─────────────────
      # A fresh tag push triggers release.yml (on: push: tags: v*) on both.
      - name: Sync local main after PR merge
        if: steps.check.outputs.changed == 'true'
        run: |
          git checkout main
          git pull origin main

      - name: Install Nushell (bump_version.nu needs it)
        if: steps.check.outputs.changed == 'true'
        run: cargo install nu --locked

      - name: Install git-cliff (bump_version.nu uses it for CHANGELOG.md)
        if: steps.check.outputs.changed == 'true'
        run: cargo install git-cliff --locked

      - name: Compute next patch version
        if: steps.check.outputs.changed == 'true'
        id: version
        run: |
          current=$(grep -m1 '^version' Cargo.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"(.*)"/\1/')
          IFS='.' read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Bump version, changelog, commit and tag
        if: steps.check.outputs.changed == 'true'
        run: nu scripts/bump_version.nu --yes ${{ steps.version.outputs.next }}

      - name: Push release commit and tag to Gitea
        if: steps.check.outputs.changed == 'true'
        run: |
          git push origin HEAD:main
          git push origin "v${{ steps.version.outputs.next }}"

      - name: Push release commit and tag to GitHub mirror
        if: steps.check.outputs.changed == 'true' && env.GITHUB_REMOTE_URL != ''
        env:
          GITHUB_REMOTE_URL: ${{ secrets.GITHUB_REMOTE_URL }}
        run: |
          git remote add github-ci "$GITHUB_REMOTE_URL"
          git push github-ci HEAD:main
          git push github-ci "v${{ steps.version.outputs.next }}"

      - name: Nothing to update
        if: steps.check.outputs.changed == 'false'
        run: echo "✅ All dependencies already up to date — nothing to update."
