[package]
name         = "tui-file-explorer"
version      = "3.0.2"
edition      = "2021"
rust-version = "1.90"
authors      = ["Sorin Irimies <sorinirimies@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/sorinirimies/tui-file-explorer"
description  = "Embeddable keyboard-driven multi-pane file explorer for Ratatui"
categories   = ["command-line-utilities", "filesystem"]
keywords     = ["tui", "ratatui", "file-explorer", "widget", "terminal"]
readme       = "README.md"
exclude      = [
    "target/",
    ".gitignore",
    "rules.md",
    "justfile",
    "cliff.toml",
    "scripts/",
    ".gitea/",
    "fuzz/",
    "examples/vhs/generated/",
]

# ── Features ──────────────────────────────────────────────────────────────────
#
# The `cli` feature (on by default) pulls in `clap` and enables the `tfe`
# binary. Library users who only want the widget can opt out:
#
#   [dependencies]
#   tui-file-explorer = { version = "3", default-features = false }
#
[features]
default = ["cli"]
# Lightweight FileExplorer/DualPane builds need no optional features.
preview = ["dep:image", "dep:ratatui-image", "archive"]
# Archive (zip / tar / tar.gz) listing for previews and extraction.
archive = ["dep:zip", "dep:tar", "dep:flate2"]
persistence = ["dep:serde", "dep:serde_json", "dep:toml"]
full-app = ["preview", "persistence", "dep:tui-slider"]
# The CLI includes the full embeddable application plus argument parsing.
cli = ["full-app", "trash", "dep:clap"]
# Send deleted entries to the OS trash / recycle bin instead of unlinking.
trash = ["dep:trash"]
# Shared tui-nuances theming (NuancesTheme, ThemeBuilder, Themed, ...). Off by default.
theme = ["dep:tui-nuances"]

# ── Dependencies ──────────────────────────────────────────────────────────────

[dependencies]
ratatui    = "0.30"
# Shared theme crate. TODO: switch to the crates.io version after publish.
tui-nuances = { version = "0.1.6", optional = true }
crossterm  = "0.29"
clap       = { version = "4", features = ["derive", "color", "wrap_help"], optional = true }
tui-slider = { version = "0.3.4", optional = true }
serde      = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
image         = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"], optional = true }
ratatui-image = { version = "11.0", default-features = false, features = ["crossterm", "image-defaults"], optional = true }
trash         = { version = "5.2.9", optional = true }
toml          = { version = "1.1.6", default-features = false, features = ["parse", "serde"], optional = true }
zip           = { version = "8.6.0", default-features = false, features = ["deflate"], optional = true }
tar           = { version = "0.4.46", default-features = false, optional = true }
flate2        = { version = "1.1.10", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

# ── Binaries ──────────────────────────────────────────────────────────────────

[[bin]]
name              = "tfe"
path              = "src/main.rs"
required-features = ["cli"]

# ── Examples ──────────────────────────────────────────────────────────────────

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "theme_switcher"
path = "examples/theme_switcher.rs"
required-features = ["theme"]

[[example]]
name = "dual_pane"
path = "examples/dual_pane.rs"

[[example]]
name = "options"
path = "examples/options.rs"

[[example]]
name = "open_file"
path = "examples/open_file.rs"

[[example]]
name = "full"
path = "examples/full.rs"
required-features = ["full-app"]

[[example]]
name = "embed"
path = "examples/embed.rs"
required-features = ["full-app"]