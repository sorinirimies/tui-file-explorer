# Every feature a user can turn on is checked.
[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # paste is unmaintained; it comes in via ratatui and image (preview). No fixed version exists.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained, transitive, no replacement upstream" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "BSL-1.0"]
exceptions = [
    # Pulled in by image -> ravif -> rav1e (preview feature). NCSA is OSI approved.
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
